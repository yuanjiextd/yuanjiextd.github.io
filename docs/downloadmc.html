<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC 下载</title>
    <style>
        /* 全局样式 - 浅色风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 56px;
            line-height: 1;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1a2332;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: #6b7a8f;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* 下载按钮 */
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #1a2332;
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
            padding: 16px 40px;
            border-radius: 60px;
            border: none;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.15s ease;
            width: 100%;
        }

        .download-btn:hover {
            background-color: #2c3a4e;
            transform: translateY(-2px);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .download-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* 文件信息 */
        .file-info {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #edf0f5;
            font-size: 14px;
            color: #8a9aa8;
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .file-info span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .file-info .label {
            color: #6b7a8f;
        }

        .file-info .value {
            color: #1a2332;
            font-weight: 500;
        }

        /* 页脚 */
        .footer {
            margin-top: 32px;
            font-size: 13px;
            color: #b0bec5;
        }

        .footer a {
            color: #6b7a8f;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #1a2332;
            text-decoration: underline;
        }

        /* 简单响应式 */
        @media (max-width: 480px) {
            .card {
                padding: 32px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .download-btn {
                font-size: 16px;
                padding: 14px 28px;
            }

            .file-info {
                flex-direction: column;
                gap: 8px;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">📦</div>
        <h1>MC.exe</h1>
        <p class="subtitle">点击下方按钮即可下载</p>

        <!-- 下载按钮 — 直接指向你的链接 -->
        <a href="https://github.com/yuanjiextd/yuanjiextd.github.io/releases/download/untagged-6ced6ef3446980194f69/MC.exe" 
           class="download-btn"
           download>
            <!-- 下载图标 (SVG) -->
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/>
                <path d="M12 15l-4-4h2.5V8h3v3H16l-4 4z"/>
                <path d="M8 17h8v1.5H8V17z"/>
            </svg>
            下载 MC.exe
        </a>

        <!-- 文件信息（你可以修改或删除） -->
        <div class="file-info">
            <span><span class="label">版本</span><span class="value">v1.0</span></span>
            <span><span class="label">大小</span><span class="value">~1GB</span></span>
            <span><span class="label">格式</span><span class="value">.exe</span></span>
        </div>

        <div class="footer">
            <a href="https://github.com/yuanjiextd" target="_blank">GitHub</a>
            &nbsp;·&nbsp;
            <a href="#">关于</a>
        </div>
    </div>

</body>
</html>
